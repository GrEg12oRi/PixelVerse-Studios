<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Mot de passe oublié</title>
    <link
      rel="stylesheet"
      href="../css/log.css"
    />
  </head>

  <body>
    <header>
      <!--Logo en cours de design-->
      <a
        class="logo"
        href="accueil.html"
      >
        <img
          src=""
          alt="Logo"
          width="100"
          height="70"
        />
      </a>
      <nav id="header-list">
        <ul>
          <li>
            <a href="accueil.html"
              >Accueil</a
            >
          </li>
          <li>
            <a href="galerie.html"
              >Galerie des
              Personnages</a
            >
          </li>
          <li>
            <a href="perso.html"
              >Mes Personnages</a

          <li>

          </li>
          <li>
            <a href="contact.html"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <form action="#" method="GET">
          <fieldset>
            <legend>
              <h2>
                Réinitialisation du mot
                de passe
              </h2>
            </legend>
            <div>
              <label for="E-mail"
                >Adresse mail :</label
              >
              <input
                type="text"
                name="mail"
                id="mail"
                required
              />
              <br /><br />
              <label for="username"
                >Pseudo :</label
              >
              <input
                type="text"
                name="username"
                id="username"
                required
              />
              <br />
              <button type="submit">
                Envoyer
              </button>
              <p>
                Un mail de
                réintitalisation de mot
                de passe vous sera
                envoyé.
              </p>
              <br />
              <a href="log.html"
                >Retourner à la page de
                connexion</a
              >
            </div>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <p>

      </p>
    </footer>
