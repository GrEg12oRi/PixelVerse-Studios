<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un compte</title>
    <link rel="stylesheet" href="../css/log.css" />
  </head>

  <body>
    <header>
      <!--Logo en cours de design-->
      <a class="logo" href="/html/accueil.html">
        <img src="" alt="Logo" width="100" height="70" />
      </a>
      <nav id="header-list">
        <ul>
          <li>
            <a href="/html/accueil.html">Accueil</a>
          </li>
          <li>
            <a href="/html/galerie.html">Galerie des Personnages</a>
          </li>
          <li>
            <a href="/html/perso.html">Mes Personnages</a>
          </li>
          <li>
            <a href="/html/log.html">Se Connecter</a>
          </li>
          <li>
            <a href="/html/contact.html">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <form action="#" method="GET">
          <fieldset>
            <legend>
              <h1>Créer mon compte</h1>
            </legend>
            <div>
              <label for="username">E-mail :</label>
              <input type="text" id="username" name="username" required />
              <br /><br />
              <label for="pseudo">Pseudo</label>
              <input type="text" id="pseudo" name="pseudo" required />
              <br /><br />
              <label for="password">Mot de passe :</label>
              <input type="password" id="password" name="password" required />
              <br /><br />
              <button type="submit">Créer mon compte</button>
              <br />
              <a href="/html/log.html">Déjà un compte ? Connectez-vous</a>
            </div>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 PixelVerse Studios</p>
    </footer>
  </body>
</html>
