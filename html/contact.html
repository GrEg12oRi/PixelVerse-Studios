<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="../css/contact.css" />
    <link rel="stylesheet" href="../scss/main.css" />
  </head>

  <body>
    <main id="main-page">
      <section>
        <form class="#" action="#" method="GET">
          <fieldset>
            <legend>
              <h1>Nous contacter</h1>
            </legend>
            <div>
              <label for="name">Nom :</label>
              <br />
              <input type="text" id="name" name="name" required />
              <br /><br />
              <label for="surname">Prénom :</label>
              <br />
              <input type="text" id="surname" name="surname" required />
              <br /><br />
              <label for="email">Email :</label>
              <br />
              <input type="email" id="email" name="email" required />
              <br /><br />
              <label for="tel">Téléphone :</label>
              <br />
              <input type="tel" id="tel" name="tel" />
            </div>
            <br />
            <div>
              <label for="theme">Thème :</label>
              <select id="theme" name="theme" required>
                <option value="Renseignements">Renseignements</option>
                <option value="Support Technique">Support Technique</option>
                <option value="other">Autre</option>
              </select>
              <br /><br />
              <label for="subject">Sujet</label>
              <select name="subject" id="subject">
                <option value="Renseignements"></option>
                <option value="Renseignements">Récupération de personnages</option>
                <option value="Support Technique">Signaler un bug</option>
                <option value="Support Technique">Problème de compte</option>
                <option value="Autre">Autre</option>
              </select>
              <br /><br />

              <label for="message">Message :</label><br />
              <textarea id="message" name="message" rows="4" cols="50" required></textarea>
              <br />
            </div>
            <button type="submit">Envoyer</button>
          </fieldset>
        </form>
      </section>
    </main>

    <script type="module" src="../Router/router.js"></script>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
