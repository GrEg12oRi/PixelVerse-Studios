<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Connexion</title>
    <link
      rel="stylesheet"
      href="../css/log.css"
    />
  </head>

  <body>
    <header>
      <!--Logo en cours de design-->
      <a
        class="logo"
        href="accueil.html"
      >
        <img
          src=""
          alt="Logo"
          width="100"
          height="70"
        />
      </a>
      <nav id="header-list">
        <ul>
          <li>
            <a href="accueil.html"
              >Accueil</a
            >
          </li>
          <li>
            <a href="galerie.html"

              Personnages</a

          <li>

        </ul>
      </nav>

    <main>
      <form action="#" method="GET">
        <fieldset>
          <legend>
            <h1>Connexion</h1>
          </legend>
          <div>
            <label for="username"
              >Pseudo ou E-mail :</label
            >
            <br />
            <input
              type="text"
              id="username"
              name="username"
              required
            />
            <br /><br />
            <label for="password"
              >Mot de passe :</label
            >
            <br />
            <input
              type="password"
              id="password"
              name="password"
              required
            />
            <br /><br />
            <a href="password.html"
              >Mot de passe oublié ?</a
            >
            <br /><br />
            <button type="submit">
              Se connecter
            </button>
            <br /><br />
            <a href="register.html"
              >Créer un compte</a
            >
            <br />
          </div>
        </fieldset>
      </form>
    </main>
