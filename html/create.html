<!doctype html>

<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un personnage</title>
    <link rel="stylesheet" href="../css/create.css" />
    <link rel="stylesheet" href="../scss/main.css" />
  </head>
  
  <body>
    <main>
      <h1>Création d'un personnage</h1>
      <section>
        <div>
          <label for="name">Pseudo : </label>
          <input type="text" id="name" name="name" required />
        </div>
        <div>
          <label for="genre">Genre : </label>
          <select name="genre" id="genre">
            <option value="masc">Masculin</option>
            <option value="fem">Féminin</option>
            <option value="other">Autre</option>
          </select>
        </div>
      </section>

      <section id="perso">
        <div class="gallery">
          <div class="gallery-item">
            <img src="../images/guerrier.png" alt="Mon perso" />
          </div>
        </div>

        <div id="button">
          <button type="submit">Créer mon Personnage</button>
          <button type="submit">Partager mon Personnage</button>
        </div>
      </section>
    </main>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../Router/router.js"></script>
  </body>
</html>
